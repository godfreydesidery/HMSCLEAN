services:
  postgres:
    image: postgres:16-alpine
    container_name: hmis-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hmis_engine
      POSTGRES_USER: hmis
      POSTGRES_PASSWORD: hmis
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmis -d hmis_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
