spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/hmis_engine
    username: hmis
    password: hmis
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.otapp.hmis.engine: DEBUG
    org.hibernate.SQL: DEBUG
