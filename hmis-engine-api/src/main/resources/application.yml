spring:
  application:
    name: hmis-engine-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hmis:
  security:
    jwt:
      # Override in env via HMIS_SECURITY_JWT_SECRET. Must be >= 32 chars (HS256).
      secret: ${HMIS_SECURITY_JWT_SECRET:change-me-change-me-change-me-change-me-32+chars}
      access-token-ttl: PT1H
      refresh-token-ttl: P7D
      issuer: hmis-engine
  cors:
    allowed-origins: ${HMIS_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    root-username: root
    root-password: ${HMIS_BOOTSTRAP_ROOT_PASSWORD:ChangeMe!123}
