<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-file-medical"></i>Assemble claim</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    <div class="alert alert-light border d-flex align-items-center gap-2 py-2 px-3">
      <i class="bi bi-info-circle"></i>
      <div class="small">Assembles a draft claim from the insurer-covered invoice lines for this payer plan and membership.</div>
    </div>
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label" for="ac-payer">Payer plan UID <span class="text-danger">*</span></label>
        <input id="ac-payer" type="text" class="form-control" formControlName="payerPlanUid" placeholder="Payer plan identifier" autocomplete="off">
      </div>
      <div class="col-12">
        <label class="form-label" for="ac-member">Membership number <span class="text-danger">*</span></label>
        <input id="ac-member" type="text" maxlength="80" class="form-control" formControlName="membershipNo" placeholder="Insurance membership number" autocomplete="off">
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Assembling</span></output>Assembling…
      } @else {
        <i class="bi bi-file-medical"></i>Assemble claim
      }
    </button>
  </div>
</form>
