<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-x-circle"></i>Reject claim</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    <div class="alert alert-light border d-flex align-items-center gap-2 py-2 px-3">
      <i class="bi bi-file-medical"></i>
      <div class="small">Claim <span class="hmis-code">{{ claim.claimNo }}</span></div>
    </div>
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label" for="rj-reason">Reason <span class="text-danger">*</span></label>
        <textarea id="rj-reason" rows="3" maxlength="255" class="form-control" formControlName="reason" placeholder="Reason the insurer rejected this claim…"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-danger d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Rejecting</span></output>Rejecting…
      } @else {
        <i class="bi bi-x-circle"></i>Reject claim
      }
    </button>
  </div>
</form>
