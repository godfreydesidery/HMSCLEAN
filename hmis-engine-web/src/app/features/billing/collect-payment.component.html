<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-cash-coin"></i>Collect payment</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    <div class="alert alert-light border d-flex align-items-center justify-content-between gap-2 py-2 px-3">
      <span class="small"><i class="bi bi-receipt me-1"></i>{{ lineUids.length }} bill(s) selected</span>
      <span class="fs-5 fw-semibold">{{ currency }} {{ total | number:'1.2-2' }}</span>
    </div>
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="cp-method">Payment method <span class="text-danger">*</span></label>
        <select id="cp-method" class="form-select" formControlName="method">
          @for (m of methods; track m.value) { <option [value]="m.value">{{ m.label }}</option> }
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="cp-received">Amount received <span class="text-danger">*</span></label>
        <input id="cp-received" type="number" min="0" step="0.01" class="form-control" formControlName="received">
        <div class="form-text d-flex justify-content-between">
          <span>Change due</span>
          <span class="fw-semibold" [class.text-danger]="change() < 0">{{ currency }} {{ change() | number:'1.2-2' }}</span>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="cp-reference">Reference</label>
        <input id="cp-reference" type="text" class="form-control" formControlName="reference" maxlength="80" autocomplete="off" placeholder="e.g. M-Pesa code">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="cp-note">Note</label>
        <input id="cp-note" type="text" class="form-control" formControlName="note" maxlength="255" autocomplete="off">
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting() || change() < 0">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Collecting</span></output>Collecting…
      } @else {
        <i class="bi bi-check2"></i>Confirm payment
      }
    </button>
  </div>
</form>
