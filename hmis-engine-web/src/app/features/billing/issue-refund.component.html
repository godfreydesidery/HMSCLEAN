<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-arrow-counterclockwise"></i>Issue refund</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    <div class="alert alert-light border d-flex align-items-center gap-2 py-2 px-3">
      <i class="bi bi-wallet2"></i>
      <div class="small">
        Invoice <span class="hmis-code">{{ invoice.invoiceNo }}</span> · Paid
        <strong>{{ invoice.totalPaid | number:'1.2-2' }} {{ invoice.currency }}</strong>
      </div>
    </div>
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="rf-amount">Amount <span class="text-danger">*</span></label>
        <input id="rf-amount" type="number" min="0.01" step="0.01" class="form-control" formControlName="amount">
        <div class="form-text">Capped at the amount paid.</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="rf-method">Method <span class="text-danger">*</span></label>
        <select id="rf-method" class="form-select" formControlName="method">
          @for (m of methods; track m.value) { <option [value]="m.value">{{ m.label }}</option> }
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="rf-reason">Reason <span class="text-danger">*</span></label>
        <select id="rf-reason" class="form-select" formControlName="reason">
          @for (r of reasons; track r.value) { <option [value]="r.value">{{ r.label }}</option> }
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="rf-ref">Reference</label>
        <input id="rf-ref" type="text" class="form-control" formControlName="reference" placeholder="Txn id, cheque no…">
      </div>
      <div class="col-12">
        <label class="form-label" for="rf-description">Description</label>
        <textarea id="rf-description" rows="2" class="form-control" formControlName="description"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output>Saving…
      } @else {
        <i class="bi bi-check2"></i>Issue refund
      }
    </button>
  </div>
</form>
