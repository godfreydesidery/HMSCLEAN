<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-clipboard2-check"></i>Add diagnosis</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-md-5">
        <label class="form-label" for="dx-kind">Kind <span class="text-danger">*</span></label>
        <select id="dx-kind" name="kind" class="form-select" formControlName="kind">
          @for (k of kinds; track k.value) { <option [value]="k.value">{{ k.label }}</option> }
        </select>
      </div>
      <div class="col-md-7">
        <label class="form-label" for="dx-type">Diagnosis <span class="text-danger">*</span></label>
        <select id="dx-type" name="diagnosisTypeUid" class="form-select" formControlName="diagnosisTypeUid">
          <option value="" disabled>{{ loadingTypes() ? 'Loading…' : '— Select a diagnosis —' }}</option>
          @for (d of diagnosisTypes(); track d.uid) {
            <option [value]="d.uid">{{ d.code }} — {{ d.name }}</option>
          }
        </select>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input id="dx-primary" type="checkbox" class="form-check-input" formControlName="primaryDiagnosis">
          <label class="form-check-label" for="dx-primary">Primary diagnosis</label>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label" for="dx-notes">Notes</label>
        <textarea id="dx-notes" rows="3" class="form-control" formControlName="notes" placeholder="Optional"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output>Saving…
      } @else {
        <i class="bi bi-check2"></i>Add diagnosis
      }
    </button>
  </div>
</form>
