<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-activity"></i>Record vitals</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert">
        <i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span>
      </div>
    }

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="v-temp">Temperature (°C)</label>
        <input id="v-temp" type="number" step="0.1" min="25" max="45" class="form-control" formControlName="temperatureC">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="v-pulse">Pulse (bpm)</label>
        <input id="v-pulse" type="number" min="20" max="250" class="form-control" formControlName="pulseBpm">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="v-resp">Respiration (bpm)</label>
        <input id="v-resp" type="number" min="5" max="80" class="form-control" formControlName="respirationBpm">
      </div>

      <div class="col-md-4">
        <label class="form-label" for="v-bp-sys">BP systolic (mmHg)</label>
        <input id="v-bp-sys" type="number" min="40" max="260" class="form-control" formControlName="bloodPressureSystolic">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="v-bp-dia">BP diastolic (mmHg)</label>
        <input id="v-bp-dia" type="number" min="20" max="200" class="form-control" formControlName="bloodPressureDiastolic">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="v-spo2">SpO₂ (%)</label>
        <input id="v-spo2" type="number" min="40" max="100" class="form-control" formControlName="spo2Percent">
      </div>

      <div class="col-md-6">
        <label class="form-label" for="v-weight">Weight (kg)</label>
        <input id="v-weight" type="number" step="0.1" min="0.5" max="400" class="form-control" formControlName="weightKg">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="v-height">Height (cm)</label>
        <input id="v-height" type="number" step="0.1" min="20" max="260" class="form-control" formControlName="heightCm">
      </div>

      <div class="col-12">
        <label class="form-label" for="v-notes">Notes</label>
        <textarea id="v-notes" rows="2" class="form-control" formControlName="notes" placeholder="Optional"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output>Saving…
      } @else {
        <i class="bi bi-check2"></i>Save vitals
      }
    </button>
  </div>
</form>
