<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="login-card__title">{{ appName }}</h1>
    <p class="login-card__subtitle">Sign in to continue</p>

    <label class="field">
      <span class="field__label">Username</span>
      <input
        type="text"
        formControlName="username"
        autocomplete="username"
        spellcheck="false"
        autofocus
      />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="field__error">Username is required.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Password is required.</span>
      }
    </label>

    @if (errorMessage()) {
      <div class="login-card__error" role="alert">{{ errorMessage() }}</div>
    }

    <button type="submit" class="login-card__submit" [disabled]="submitting()">
      @if (submitting()) {
        Signing in…
      } @else {
        Sign in
      }
    </button>
  </form>
</div>
