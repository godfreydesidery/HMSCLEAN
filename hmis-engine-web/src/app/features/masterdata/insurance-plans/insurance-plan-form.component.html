<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2">
    <i class="bi" [class.bi-pencil-square]="isEdit" [class.bi-plus-circle]="!isEdit"></i>{{ title }}
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="ip-code">Code <span class="text-danger">*</span></label>
        <input id="ip-code" name="code" type="text" class="form-control text-uppercase" formControlName="code" autocomplete="off" placeholder="e.g. NHIF-STD">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="ip-name">Plan name <span class="text-danger">*</span></label>
        <input id="ip-name" name="name" type="text" class="form-control" formControlName="name" autocomplete="off">
      </div>
      <div class="col-12">
        <label class="form-label" for="ip-provider">Provider <span class="text-danger">*</span></label>
        <select id="ip-provider" name="providerUid" class="form-select" formControlName="providerUid">
          <option value="" disabled>— Select an insurance provider —</option>
          @for (p of providers(); track p.uid) {
            <option [value]="p.uid">{{ p.name }} ({{ p.code }})</option>
          }
        </select>
      </div>

      <div class="col-12">
        <div class="card border bg-light">
          <div class="card-body py-3">
            <div class="hmis-muted small text-uppercase fw-semibold mb-2" style="letter-spacing:0.05em;font-size:0.7rem;">Coverage</div>
            <div class="row g-2">
              <div class="col-md-4 col-6">
                <div class="form-check">
                  <input id="ip-cov-cons" type="checkbox" class="form-check-input" formControlName="coversConsultation">
                  <label class="form-check-label small" for="ip-cov-cons">Consultations</label>
                </div>
              </div>
              <div class="col-md-4 col-6">
                <div class="form-check">
                  <input id="ip-cov-lab" type="checkbox" class="form-check-input" formControlName="coversLab">
                  <label class="form-check-label small" for="ip-cov-lab">Lab tests</label>
                </div>
              </div>
              <div class="col-md-4 col-6">
                <div class="form-check">
                  <input id="ip-cov-rad" type="checkbox" class="form-check-input" formControlName="coversRadiology">
                  <label class="form-check-label small" for="ip-cov-rad">Radiology</label>
                </div>
              </div>
              <div class="col-md-4 col-6">
                <div class="form-check">
                  <input id="ip-cov-proc" type="checkbox" class="form-check-input" formControlName="coversProcedure">
                  <label class="form-check-label small" for="ip-cov-proc">Procedures</label>
                </div>
              </div>
              <div class="col-md-4 col-6">
                <div class="form-check">
                  <input id="ip-cov-med" type="checkbox" class="form-check-input" formControlName="coversMedicine">
                  <label class="form-check-label small" for="ip-cov-med">Medicines</label>
                </div>
              </div>
              <div class="col-md-4 col-6">
                <div class="form-check">
                  <input id="ip-cov-adm" type="checkbox" class="form-check-input" formControlName="coversAdmission">
                  <label class="form-check-label small" for="ip-cov-adm">Admissions</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label" for="ip-description">Description</label>
        <textarea id="ip-description" name="description" rows="3" class="form-control" formControlName="description"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output>Saving…
      } @else {
        <i class="bi bi-check2"></i>{{ isEdit ? 'Save changes' : 'Create plan' }}
      }
    </button>
  </div>
</form>
