<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2">
    <i class="bi" [class.bi-pencil-square]="isEdit" [class.bi-plus-circle]="!isEdit"></i>{{ title }}
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="ins-code">Code <span class="text-danger">*</span></label>
        <input id="ins-code" name="code" type="text" class="form-control text-uppercase" formControlName="code" autocomplete="off" placeholder="e.g. NHIF">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="ins-name">Name <span class="text-danger">*</span></label>
        <input id="ins-name" name="name" type="text" class="form-control" formControlName="name" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ins-contact">Contact person</label>
        <input id="ins-contact" name="contactPerson" type="text" class="form-control" formControlName="contactPerson" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ins-phone">Phone</label>
        <input id="ins-phone" name="phone" type="tel" class="form-control" formControlName="phone" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ins-email">Email</label>
        <input id="ins-email" name="email" type="email" class="form-control" formControlName="email" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ins-address">Address</label>
        <input id="ins-address" name="address" type="text" class="form-control" formControlName="address" autocomplete="off">
      </div>
      <div class="col-12">
        <label class="form-label" for="ins-description">Description</label>
        <textarea id="ins-description" name="description" rows="3" class="form-control" formControlName="description"></textarea>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output>Saving…
      } @else {
        <i class="bi bi-check2"></i>{{ isEdit ? 'Save changes' : 'Create insurance provider' }}
      }
    </button>
  </div>
</form>
