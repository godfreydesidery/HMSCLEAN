<div class="modal-header">
  <h5 class="modal-title d-flex align-items-center gap-2"><i class="bi bi-arrow-left-right"></i>Change payment type</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    <div class="alert alert-light border d-flex align-items-center gap-2 py-2 px-3">
      <i class="bi bi-person-vcard"></i>
      <div class="small">{{ patient.firstName }} {{ patient.lastName }} · <span class="hmis-code">{{ patient.patientNo }}</span></div>
    </div>
    @if (errorMessage()) {
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert"><i class="bi bi-exclamation-circle"></i><span class="small">{{ errorMessage() }}</span></div>
    }
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="cpt-type">Payment type <span class="text-danger">*</span></label>
        <select id="cpt-type" class="form-select" formControlName="paymentType">
          @for (t of paymentTypes; track t.value) { <option [value]="t.value">{{ t.label }}</option> }
        </select>
      </div>
      @if (insuranceRequired) {
        <div class="col-md-6">
          <label class="form-label" for="cpt-plan">Insurance plan <span class="text-danger">*</span></label>
          <select id="cpt-plan" class="form-select" formControlName="insurancePlanUid">
            <option value="">— Select a plan —</option>
            @for (pl of plans(); track pl.uid) { <option [value]="pl.uid">{{ pl.name }} ({{ pl.providerName || pl.code }})</option> }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="cpt-member">Membership no</label>
          <input id="cpt-member" type="text" class="form-control" formControlName="membershipNo" maxlength="64" autocomplete="off">
        </div>
      }
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
    <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output>Saving…
      } @else {
        <i class="bi bi-check2"></i>Save
      }
    </button>
  </div>
</form>
