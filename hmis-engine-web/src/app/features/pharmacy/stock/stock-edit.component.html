<div class="modal-header">
  <div>
    <h5 class="modal-title">{{ title }}</h5>
    <div class="hmis-muted small mt-1">{{ pharmacyName }}</div>
  </div>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()" aria-label="Close"></button>
</div>

<div class="modal-body">
  @if (errorMessage()) {
    <div class="alert alert-danger d-flex align-items-center gap-2" role="alert"><i class="bi bi-exclamation-circle"></i><span>{{ errorMessage() }}</span></div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label class="form-label" for="se-medicine">Medicine <span class="text-danger">*</span></label>
      @if (prefillMedicineUid) {
        <input id="se-medicine" type="text" class="form-control" [value]="prefillMedicineLabel" disabled>
      } @else {
        <select id="se-medicine" name="medicineUid" class="form-select" formControlName="medicineUid">
          <option value="" disabled>{{ loadingMedicines() ? 'Loading…' : '— Select medicine —' }}</option>
          @for (m of medicines(); track m.uid) {
            <option [value]="m.uid">{{ m.code }} — {{ m.name }}@if (m.strength) { <span> · {{ m.strength }}</span> }</option>
          }
        </select>
      }
    </div>

    <div class="mb-3">
      <label class="form-label" for="se-qty">{{ quantityLabel }} <span class="text-danger">*</span></label>
      <input id="se-qty" name="quantity" type="number" step="1" class="form-control" formControlName="quantity">
      @if (mode === 'adjust') {
        <div class="form-text">Use a positive number to add, negative to remove. Must be non-zero.</div>
      }
    </div>

    <div class="mb-2">
      <label class="form-label" for="se-note">Note</label>
      <textarea id="se-note" name="note" rows="3" class="form-control" formControlName="note" maxlength="500" placeholder="Reference document, reason for adjustment, batch number…"></textarea>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
  <button type="button" class="btn btn-primary d-flex align-items-center gap-2" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) { <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output> }
    <i class="bi bi-check2"></i>{{ submitLabel }}
  </button>
</div>
