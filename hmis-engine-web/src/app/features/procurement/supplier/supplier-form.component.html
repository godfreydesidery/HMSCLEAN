<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()" aria-label="Close"></button>
</div>

<div class="modal-body">
  @if (errorMessage()) {
    <div class="alert alert-danger d-flex align-items-center gap-2" role="alert"><i class="bi bi-exclamation-circle"></i><span>{{ errorMessage() }}</span></div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="sf-code">Code <span class="text-danger">*</span></label>
        <input id="sf-code" name="code" type="text" class="form-control" formControlName="code" maxlength="32" autocomplete="off">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="sf-name">Name <span class="text-danger">*</span></label>
        <input id="sf-name" name="name" type="text" class="form-control" formControlName="name" maxlength="200" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-contact">Contact person</label>
        <input id="sf-contact" name="contactName" type="text" class="form-control" formControlName="contactName" maxlength="120">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-phone">Phone</label>
        <input id="sf-phone" name="phone" type="text" class="form-control" formControlName="phone" maxlength="32">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-email">Email</label>
        <input id="sf-email" name="email" type="email" class="form-control" formControlName="email" maxlength="120">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-tax">Tax ID</label>
        <input id="sf-tax" name="taxId" type="text" class="form-control" formControlName="taxId" maxlength="64">
      </div>
      <div class="col-12">
        <label class="form-label" for="sf-address">Address</label>
        <input id="sf-address" name="address" type="text" class="form-control" formControlName="address" maxlength="255">
      </div>
      <div class="col-12">
        <label class="form-label" for="sf-notes">Notes</label>
        <textarea id="sf-notes" name="notes" rows="3" class="form-control" formControlName="notes" maxlength="500"></textarea>
      </div>
      <div class="col-12">
        <h6 class="mt-2 mb-0">VAT &amp; banking</h6>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-vrn">VAT registration no. (VRN)</label>
        <input id="sf-vrn" name="vrn" type="text" class="form-control" formControlName="vrn" maxlength="32">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-bank-name">Bank name</label>
        <input id="sf-bank-name" name="bankName" type="text" class="form-control" formControlName="bankName" maxlength="120">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-bank-account-name">Bank account name</label>
        <input id="sf-bank-account-name" name="bankAccountName" type="text" class="form-control" formControlName="bankAccountName" maxlength="200">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sf-bank-account-no">Bank account no.</label>
        <input id="sf-bank-account-no" name="bankAccountNo" type="text" class="form-control" formControlName="bankAccountNo" maxlength="64">
      </div>
      <div class="col-12">
        <label class="form-label" for="sf-terms">Terms of contract</label>
        <textarea id="sf-terms" name="termsOfContract" rows="3" class="form-control" formControlName="termsOfContract" maxlength="1000"></textarea>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light border" (click)="activeModal.dismiss()" [disabled]="submitting()">Cancel</button>
  <button type="button" class="btn btn-primary d-flex align-items-center gap-2" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) { <output class="spinner-border spinner-border-sm" aria-live="polite"><span class="visually-hidden">Saving</span></output> }
    <i class="bi bi-check2"></i>{{ isEdit ? 'Save changes' : 'Create supplier' }}
  </button>
</div>
