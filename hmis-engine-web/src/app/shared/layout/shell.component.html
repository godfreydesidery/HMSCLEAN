<div class="shell" [class.shell--collapsed]="sidebarCollapsed()">
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <i class="bi bi-activity shell__brand-icon"></i>
      <span class="shell__brand-text">HMIS Engine</span>
    </div>

    <nav class="shell__nav">
      @for (group of navGroups(); track group.label) {
        <div class="shell__nav-group">
          <div class="shell__nav-group-label">{{ group.label }}</div>
          @for (item of group.items; track item.path) {
            <a
              class="shell__nav-link"
              [routerLink]="item.path"
              routerLinkActive="shell__nav-link--active"
              [title]="item.label"
            >
              <i class="bi {{ item.icon }}"></i>
              <span class="shell__nav-label">{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </nav>

    <div class="shell__sidebar-footer">
      <span class="shell__sidebar-version">v0.1.0</span>
    </div>
  </aside>

  <div class="shell__main">
    <header class="shell__topbar">
      <button
        type="button"
        class="btn btn-light btn-sm shell__menu-toggle"
        (click)="toggleSidebar()"
        aria-label="Toggle navigation"
      >
        <i class="bi bi-list"></i>
      </button>

      <div class="shell__search">
        <i class="bi bi-search"></i>
        <input
          type="text"
          name="globalSearch"
          autocomplete="off"
          placeholder="Search patients, orders, users…"
          aria-label="Global search"
        />
      </div>

      <div class="shell__topbar-actions">
        <button
          type="button"
          class="btn btn-sm shell__icon-btn"
          aria-label="Notifications"
        >
          <i class="bi bi-bell"></i>
          <span class="shell__icon-badge"></span>
        </button>

        @if (user(); as u) {
          <div ngbDropdown placement="bottom-end" class="d-inline-block">
            <button
              type="button"
              class="shell__user-chip"
              ngbDropdownToggle
              aria-label="User menu"
            >
              <span class="shell__avatar">{{ initials() }}</span>
              <span class="shell__user-meta d-none d-md-flex">
                <span class="shell__user-name">{{ u.firstName }} {{ u.lastName }}</span>
                <span class="shell__user-role">{{ u.username }}</span>
              </span>
              <i class="bi bi-chevron-down d-none d-md-inline shell__caret"></i>
            </button>
            <div ngbDropdownMenu class="shadow-sm">
              <div class="dropdown-header">
                <div class="fw-semibold">{{ u.firstName }} {{ u.lastName }}</div>
                <div class="hmis-muted small">{{ u.email ?? u.username }}</div>
              </div>
              <div class="dropdown-divider"></div>
              <button type="button" ngbDropdownItem>
                <i class="bi bi-person me-2"></i>My profile
              </button>
              <button type="button" ngbDropdownItem>
                <i class="bi bi-key me-2"></i>Change password
              </button>
              <div class="dropdown-divider"></div>
              <button type="button" ngbDropdownItem class="text-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Sign out
              </button>
            </div>
          </div>
        }
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
