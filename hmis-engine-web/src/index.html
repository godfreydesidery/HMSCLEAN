<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HMIS Engine</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the
    // build-time default. Keep this list in sync with ThemeService.
    (function () {
      var DARK = { midnight: true };
      var t = localStorage.getItem('hmis-theme') || 'desktop';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.bsTheme = DARK[t] ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
